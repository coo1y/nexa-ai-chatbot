# Render Blueprint — one Docker web service (API + built frontend) and a managed Postgres.
# Deploys are triggered by GitHub Actions after all tests pass (autoDeploy: false).
# See docs/deployment.md.
services:
  - type: web
    name: nexa
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexa-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false            # set in the Render dashboard; never committed
      - key: SEARCH_PROVIDER
        value: duckduckgo
      - key: OPS_TOKEN
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "*"             # Render's proxy terminates TLS; see security/threat-model.md

databases:
  - name: nexa-db
    plan: free
    # Must match the web service: Render's internal database hostname only resolves
    # from services in the same region (otherwise migrations fail with "Name or service not known").
    region: singapore
    databaseName: nexa
    user: nexa
