[project]
name = "nexa-backend"
version = "1.0.0"
description = "Nexa AI assistant backend: model routing, tools, safety and streaming chat API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: full-stack tests through HTTP with a real database (run with -m integration)",
]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:ddgs.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "BLE"]
# E501: line length is enforced by `ruff format`; long prompt/regex literals are intentional.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "S101", "B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "RUF012"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["migrations/", "tests/"]
