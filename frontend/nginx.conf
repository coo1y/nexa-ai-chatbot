# SPA + reverse proxy (an nginx template: ${BACKEND_HOST} is substituted at container start).

upstream nexa_backend {
  server ${BACKEND_HOST}:8000;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://nexa_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append): a client-supplied X-Forwarded-For must not spoof the rate-limit key.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Server-Sent Events: stream tokens immediately, allow long generations.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    # The backend sets its own security headers; avoid duplicates.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
  }

  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
