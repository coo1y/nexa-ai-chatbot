# CI/CD: every push and PR runs lint, type checks, unit, integration, contract and browser
# end-to-end tests. Pushes to main deploy to Render only after every test job passes,
# then smoke-test the live URL.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa
          POSTGRES_DB: nexa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint & format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-report=xml:coverage-unit.xml
      - name: Migrations apply cleanly on PostgreSQL (upgrade → check → downgrade → upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://nexa:nexa@localhost:5432/nexa_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Integration tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://nexa:nexa@localhost:5432/nexa_test
        run: uv run pytest tests/integration -m integration --cov --cov-report=xml:coverage-integration.xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage-*.xml

  frontend:
    name: Frontend · lint, types, contract drift, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Generated API types match openapi.yaml
        run: npm run check:api
      - run: npm run test:coverage
      - run: npm run build

  agent-pack:
    name: Agent extension pack · hooks & MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Hook guardrail tests
        run: uv run --no-project --python 3.12 --with pytest pytest agent-hooks/tests -q -p no:cacheprovider
      - name: MCP server tests
        working-directory: mcp-server
        run: |
          uv sync --frozen
          uv run ruff check --line-length 120 .
          uv run pytest -q

  e2e:
    name: End-to-end · docker compose + Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack (mock model & search)
        run: docker compose up --build --detach --wait --wait-timeout 180
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright against http://localhost:8080
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt; tail -200 compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            compose-logs.txt
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nexa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend, agent-pack, e2e, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not configured (see docs/deployment.md)"; exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL?ref=${GITHUB_SHA}"
      - name: Wait for the new version and smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$APP_URL/api/v1/health" | tee /tmp/health.json | grep -q '"status":"ok"'; then break; fi
            sleep 10
          done
          cat /tmp/health.json
          curl -fsS "$APP_URL/api/v1/capabilities" > /dev/null
          curl -fsS "$APP_URL/" | grep -q '<div id="root">'
          echo "Deployment healthy at $APP_URL"
